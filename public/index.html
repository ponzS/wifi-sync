<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wi-Fi 文件共享</title>
    <style>
      :root,
      [data-theme="dark"] {
        color-scheme: dark;
        --app-bg: #111113;
        --app-bg-end: #171719;
        --surface: rgba(35, 35, 39, 0.72);
        --surface-solid: #232327;
        --surface-raised: rgba(47, 47, 52, 0.76);
        --field: rgba(20, 20, 23, 0.9);
        --chrome: rgba(30, 30, 34, 0.72);
        --border: rgba(255, 255, 255, 0.13);
        --border-strong: rgba(255, 255, 255, 0.24);
        --text: #f5f5f7;
        --text-muted: #a1a1aa;
        --accent: #0a84ff;
        --accent-contrast: #ffffff;
        --accent-soft: rgba(10, 132, 255, 0.18);
        --green: #30d158;
        --red: #ff453a;
        --orange: #ff9f0a;
        --cyan: #64d2ff;
        --row: rgba(255, 255, 255, 0.055);
        --button-surface: rgba(255, 255, 255, 0.075);
        --button-hover: rgba(255, 255, 255, 0.12);
        --shadow: rgba(0, 0, 0, 0.34);
        --focus: rgba(10, 132, 255, 0.72);
        --radius: 8px;
        --radius-sm: 6px;
        --blur: 22px;
        --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        --ease-press: cubic-bezier(0.2, 0, 0, 1);
      }

      [data-theme="light"] {
        color-scheme: light;
        --app-bg: #f5f5f7;
        --app-bg-end: #ebeaf0;
        --surface: rgba(255, 255, 255, 0.74);
        --surface-solid: #ffffff;
        --surface-raised: rgba(255, 255, 255, 0.86);
        --field: rgba(248, 248, 251, 0.96);
        --chrome: rgba(255, 255, 255, 0.74);
        --border: rgba(25, 25, 31, 0.12);
        --border-strong: rgba(25, 25, 31, 0.2);
        --text: #1d1d1f;
        --text-muted: #6e6e73;
        --accent: #0066cc;
        --accent-contrast: #ffffff;
        --accent-soft: rgba(0, 102, 204, 0.12);
        --green: #248a3d;
        --red: #d70015;
        --orange: #bf5b00;
        --cyan: #0071a4;
        --row: rgba(0, 0, 0, 0.035);
        --button-surface: rgba(0, 0, 0, 0.045);
        --button-hover: rgba(0, 0, 0, 0.07);
        --shadow: rgba(0, 0, 0, 0.12);
        --focus: rgba(0, 102, 204, 0.56);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--app-bg);
        color: var(--text);
        font: 100%/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        font-optical-sizing: auto;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background:
          linear-gradient(180deg, var(--app-bg-end) 0, var(--app-bg) 42rem),
          var(--app-bg);
      }

      a {
        color: var(--accent);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.52;
      }

      :where(button, a, textarea, label):focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }

      ::selection {
        background: var(--accent-soft);
      }

      .shell {
        width: min(1480px, 100%);
        min-height: 100vh;
        margin: 0 auto;
        padding: 32px 40px 44px;
      }

      .topbar {
        position: sticky;
        top: 12px;
        z-index: 10;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, auto);
        gap: 18px;
        align-items: center;
        margin-bottom: 20px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--chrome);
        box-shadow: 0 14px 34px var(--shadow);
        -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
        backdrop-filter: blur(var(--blur)) saturate(180%);
      }

      .brand-kicker,
      .panel-title,
      .status-label,
      .meta-label,
      .command-button,
      .theme-option,
      .file-action,
      .file-head {
        letter-spacing: 0;
        text-transform: none;
      }

      .brand-kicker {
        color: var(--text-muted);
        font-size: 0.875rem;
        font-weight: 600;
        line-height: 1.25;
      }

      h1 {
        margin: 2px 0 0;
        color: var(--text);
        font-size: 2.75rem;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.02;
      }

      .address-strip {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
        max-width: 760px;
      }

      .status-label {
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 11px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text-muted);
        background: var(--button-surface);
        font-size: 0.8125rem;
        line-height: 1;
        white-space: nowrap;
      }

      .status-label strong {
        color: var(--text);
        font-weight: 650;
        letter-spacing: 0;
        text-transform: none;
      }

      .status-label.is-online {
        border-color: color-mix(in srgb, var(--green) 58%, transparent);
        color: var(--green);
      }

      .status-label.is-sync {
        border-color: color-mix(in srgb, var(--cyan) 58%, transparent);
        color: var(--cyan);
      }

      .status-label.is-warn {
        border-color: color-mix(in srgb, var(--orange) 58%, transparent);
        color: var(--orange);
      }

      .status-label.is-error {
        border-color: color-mix(in srgb, var(--red) 58%, transparent);
        color: var(--red);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(300px, 0.68fr) minmax(560px, 1.32fr);
        gap: 18px;
        align-items: start;
      }

      .stack {
        display: grid;
        gap: 18px;
      }

      .auris-frame {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-solid);
      }

      .panel {
        min-width: 0;
      }

      .panel.auris-frame {
        overflow: hidden;
        background: var(--surface);
        box-shadow: 0 18px 48px var(--shadow);
        -webkit-backdrop-filter: blur(var(--blur)) saturate(180%);
        backdrop-filter: blur(var(--blur)) saturate(180%);
      }

      .panel-header {
        display: flex;
        min-height: 52px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 18px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-raised);
      }

      .panel-title {
        color: var(--text);
        font-size: 0.9375rem;
        font-weight: 700;
      }

      .panel-code {
        color: var(--text-muted);
        font-size: 0.8125rem;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0;
      }

      .panel-body {
        padding: 18px;
      }

      .dropzone {
        display: grid;
        min-height: 214px;
        place-items: center;
        padding: 24px;
        border-style: dashed;
        border-color: var(--border-strong);
        background: var(--field);
        text-align: center;
        transition:
          transform 220ms var(--ease-out),
          background-color 180ms var(--ease-out),
          border-color 180ms var(--ease-out),
          box-shadow 220ms var(--ease-out);
      }

      .dropzone:active {
        transform: scale(0.992);
        transition-duration: 90ms;
        transition-timing-function: var(--ease-press);
      }

      .dropzone.is-dragging {
        border-color: var(--accent);
        background: var(--accent-soft);
        box-shadow: 0 14px 34px var(--shadow);
        transform: translateY(-2px) scale(1.006);
      }

      .dropzone input {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
      }

      .drop-title {
        display: block;
        margin: 0;
        color: var(--text);
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 0;
        line-height: 1.08;
      }

      .drop-meta {
        display: block;
        margin: 10px 0 0;
        color: var(--text-muted);
        font-size: 0.9375rem;
        line-height: 1.55;
      }

      .command-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin-top: 14px;
      }

      .command-button,
      .file-action,
      .theme-option {
        min-height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 14px;
        border: 1px solid var(--border);
        color: var(--accent);
        background: var(--button-surface);
        font-size: 0.875rem;
        font-weight: 650;
        line-height: 1.1;
        transition:
          transform 120ms var(--ease-out),
          background-color 160ms var(--ease-out),
          border-color 160ms var(--ease-out),
          color 160ms var(--ease-out);
      }

      .command-button:hover:not(:disabled),
      .file-action:hover:not(:disabled),
      .theme-option:hover:not(:disabled) {
        background: var(--button-hover);
        border-color: var(--border-strong);
      }

      .command-button:active:not(:disabled),
      .file-action:active:not(:disabled),
      .theme-option:active:not(:disabled) {
        transform: scale(0.98);
        transition-duration: 80ms;
        transition-timing-function: var(--ease-press);
      }

      .command-button.primary {
        border-color: transparent;
        background: var(--accent);
        color: var(--accent-contrast);
      }

      .command-button.primary:hover:not(:disabled),
      .theme-option[aria-pressed="true"]:hover:not(:disabled) {
        border-color: transparent;
        background: var(--accent);
        color: var(--accent-contrast);
      }

      .command-button.danger,
      .file-action.danger {
        color: var(--red);
      }

      .theme-switch {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--field);
      }

      .theme-option {
        min-height: 36px;
        border-color: transparent;
        background: transparent;
        color: var(--text-muted);
      }

      .theme-option[aria-pressed="true"] {
        border-color: transparent;
        background: var(--accent);
        color: var(--accent-contrast);
      }

      .metric-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--border);
      }

      .metric {
        min-width: 0;
        padding: 15px;
        background: var(--field);
      }

      .meta-label {
        color: var(--text-muted);
        font-size: 0.8125rem;
        font-weight: 600;
      }

      .metric-value {
        margin-top: 6px;
        color: var(--text);
        font-size: 1.75rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.02;
      }

      .qr-grid {
        display: grid;
        grid-template-columns: 148px minmax(0, 1fr);
        gap: 16px;
        align-items: center;
      }

      .qr-code {
        width: 148px;
        height: 148px;
        display: block;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: #ffffff;
        box-shadow: 0 10px 24px var(--shadow);
        image-rendering: pixelated;
      }

      .qr-copy {
        display: grid;
        gap: 10px;
        min-width: 0;
      }

      .qr-url {
        color: var(--accent);
        font-size: 0.9375rem;
        font-weight: 650;
        line-height: 1.55;
        overflow-wrap: anywhere;
        text-decoration: none;
      }

      .qr-url:hover {
        text-decoration: underline;
      }

      .qr-hint {
        color: var(--text-muted);
        font-size: 0.875rem;
        line-height: 1.5;
      }

      .progress-block {
        display: grid;
        gap: 10px;
      }

      .board-toolbar {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 12px;
        align-items: center;
        margin-bottom: 14px;
      }

      .board-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .board-editor-wrap {
        display: grid;
        gap: 12px;
      }

      .board-editor {
        min-height: 340px;
        width: 100%;
        resize: vertical;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--field);
        color: var(--text);
        padding: 15px;
        line-height: 1.65;
        caret-color: var(--accent);
        outline: none;
        transition:
          border-color 160ms var(--ease-out),
          box-shadow 160ms var(--ease-out),
          background-color 160ms var(--ease-out);
      }

      .board-editor:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      .board-footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        color: var(--text-muted);
        font-size: 0.8125rem;
        line-height: 1.6;
      }

      .board-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }

      .board-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(108px, auto));
        gap: 8px;
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        color: var(--text-muted);
        font-size: 0.875rem;
        line-height: 1.5;
      }

      .progress-meta strong {
        color: var(--text);
        font-weight: 700;
      }

      .progress-track {
        height: 10px;
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--field);
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: var(--accent);
        transition: width 140ms linear;
      }

      .file-list {
        display: grid;
        overflow-x: auto;
      }

      .file-head,
      .file-row {
        min-width: 820px;
        display: grid;
        grid-template-columns: minmax(220px, 1fr) 96px 96px 132px 156px;
        gap: 12px;
        align-items: center;
      }

      .file-head {
        min-height: 40px;
        padding: 0 14px;
        border-bottom: 1px solid var(--border);
        color: var(--text-muted);
        background: var(--surface-raised);
        font-size: 0.8125rem;
        font-weight: 650;
      }

      .file-row {
        min-height: 68px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        color: var(--text);
        transition: background-color 140ms var(--ease-out);
      }

      .file-row:hover {
        background: var(--row);
      }

      .file-row:last-child {
        border-bottom: 0;
      }

      .file-name {
        min-width: 0;
      }

      .file-name strong {
        display: block;
        overflow-wrap: anywhere;
        font-size: 0.9375rem;
        font-weight: 700;
        line-height: 1.3;
      }

      .file-ext {
        display: inline-block;
        margin-top: 6px;
        color: var(--cyan);
        font-size: 0.8125rem;
        font-weight: 600;
        letter-spacing: 0;
        text-transform: none;
      }

      .file-size,
      .file-downloads,
      .file-time {
        color: var(--text-muted);
        font-size: 0.8125rem;
        font-variant-numeric: tabular-nums;
      }

      .file-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .file-action {
        min-height: 36px;
      }

      .empty-state {
        min-height: 260px;
        display: grid;
        place-items: center;
        padding: 32px;
        color: var(--text-muted);
        text-align: center;
        line-height: 1.6;
      }

      .log-list {
        display: grid;
        max-height: 260px;
        overflow: auto;
        gap: 6px;
        padding: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--field);
      }

      .log-line {
        display: grid;
        grid-template-columns: 68px 1fr;
        gap: 10px;
        color: var(--text-muted);
        font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 0.8125rem;
        line-height: 1.45;
      }

      .log-line[data-level="ok"] {
        color: var(--green);
      }

      .log-line[data-level="warn"] {
        color: var(--orange);
      }

      .log-line[data-level="error"] {
        color: var(--red);
      }

      .log-time {
        color: var(--cyan);
        font-variant-numeric: tabular-nums;
      }

      .cursor {
        display: inline-block;
        width: 0.45em;
        height: 0.45em;
        margin-left: 0.35em;
        border-radius: 50%;
        background: currentColor;
        vertical-align: 0.05em;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }

        .dropzone.is-dragging,
        .command-button:active:not(:disabled),
        .file-action:active:not(:disabled),
        .theme-option:active:not(:disabled) {
          transform: none;
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        .topbar,
        .panel.auris-frame {
          background: var(--surface-solid);
          -webkit-backdrop-filter: none;
          backdrop-filter: none;
        }
      }

      @media (prefers-contrast: more) {
        :root,
        [data-theme="dark"],
        [data-theme="light"] {
          --border: currentColor;
          --border-strong: currentColor;
        }

        .topbar,
        .panel.auris-frame,
        .dropzone,
        .board-editor,
        .log-list,
        .progress-track {
          border-width: 2px;
        }
      }

      @media (max-width: 1120px) {
        .shell {
          padding: 24px;
        }

        .topbar,
        .workspace {
          grid-template-columns: 1fr;
        }

        .topbar {
          position: static;
        }

        .address-strip {
          justify-content: flex-start;
        }
      }

      @media (max-width: 980px) {
        h1 {
          font-size: 2.25rem;
        }

        .file-head {
          display: none;
        }

        .file-row {
          min-width: 0;
          grid-template-columns: 1fr;
          gap: 8px;
          padding: 14px;
        }

        .file-size::before {
          content: "大小 ";
        }

        .file-downloads::before {
          content: "下载 ";
        }

        .file-time::before {
          content: "修改 ";
        }

        .file-actions {
          grid-template-columns: 1fr 1fr;
          max-width: 280px;
        }
      }

      @media (max-width: 720px) {
        .shell {
          padding: 16px 14px 28px;
        }

        h1 {
          font-size: 1.95rem;
        }

        .panel-header,
        .panel-body {
          padding-left: 14px;
          padding-right: 14px;
        }

        .metric-grid,
        .qr-grid,
        .command-row,
        .board-toolbar,
        .board-actions {
          grid-template-columns: 1fr;
        }

        .qr-code {
          width: min(180px, 100%);
          height: auto;
          aspect-ratio: 1;
        }

        .drop-title {
          font-size: 1.625rem;
        }

        .address-strip {
          gap: 6px;
        }

        .status-label {
          width: 100%;
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar" aria-label="共享状态">
        <div>
          <div class="brand-kicker">局域网共享</div>
          <h1>Wi-Fi 文件共享</h1>
        </div>
        <div class="address-strip" id="addressStrip">
          <span class="status-label is-sync">地址 <strong>检测中</strong></span>
        </div>
      </header>

      <section class="workspace" aria-label="文件共享工作台">
        <div class="stack">
          <section class="panel auris-frame">
            <div class="panel-header">
              <div class="panel-title">上传</div>
              <div class="panel-code">文件</div>
            </div>
            <div class="panel-body">
              <label class="dropzone auris-frame" id="dropzone" role="button" tabindex="0" aria-describedby="dropHint">
                <input id="fileInput" type="file" multiple />
                <span>
                  <span class="drop-title">拖放或选择文件</span>
                  <span class="drop-meta" id="dropHint">完成后会出现在共享列表中。</span>
                </span>
              </label>

              <div class="command-row">
                <button class="command-button primary auris-frame" id="selectButton" type="button">选择文件</button>
                <button class="command-button auris-frame" id="refreshButton" type="button">刷新列表</button>
              </div>
            </div>
          </section>

          <section class="panel auris-frame">
            <div class="panel-header">
              <div class="panel-title">扫码访问</div>
              <div class="panel-code">二维码</div>
            </div>
            <div class="panel-body">
              <div class="qr-grid">
                <img class="qr-code" id="qrImage" alt="扫码进入此文件共享页面" />
                <div class="qr-copy">
                  <a class="qr-url" id="qrLink" href="#" target="_blank" rel="noreferrer">等待生成访问地址</a>
                  <div class="qr-hint">同一局域网设备扫码访问。</div>
                </div>
              </div>
            </div>
          </section>

          <section class="panel auris-frame">
            <div class="panel-header">
              <div class="panel-title">当前状态</div>
              <div class="panel-code">概览</div>
            </div>
            <div class="panel-body">
              <div class="metric-grid">
                <div class="metric">
                  <div class="meta-label">文件数量</div>
                  <div class="metric-value" id="fileCount">0</div>
                </div>
                <div class="metric">
                  <div class="meta-label">占用空间</div>
                  <div class="metric-value" id="totalSize">0 B</div>
                </div>
                <div class="metric">
                  <div class="meta-label">在线人数</div>
                  <div class="metric-value" id="onlineUsers">0</div>
                </div>
              </div>
            </div>
          </section>

          <section class="panel auris-frame">
            <div class="panel-header">
              <div class="panel-title">外观</div>
              <div class="panel-code">主题</div>
            </div>
            <div class="panel-body">
              <div class="theme-switch" role="group" aria-label="主题模式">
                <button class="theme-option auris-frame" id="darkMode" type="button" aria-pressed="true">深色</button>
                <button class="theme-option auris-frame" id="lightMode" type="button" aria-pressed="false">浅色</button>
              </div>
            </div>
          </section>
        </div>

        <div class="stack">
          <section class="panel auris-frame">
            <div class="panel-header">
              <div class="panel-title">传输</div>
              <div class="panel-code" id="operationCode">待命</div>
            </div>
            <div class="panel-body">
              <div class="progress-block">
                <div class="progress-meta">
                  <span id="operationName">等待传输任务</span>
                  <strong id="operationPercent">0%</strong>
                </div>
                <div
                  class="progress-track"
                  id="progressTrack"
                  role="progressbar"
                  aria-label="传输进度"
                  aria-valuemin="0"
                  aria-valuemax="100"
                  aria-valuenow="0"
                >
                  <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-meta">
                  <span id="operationBytes">0 B / 0 B</span>
                  <span id="operationRate">0 B/s</span>
                </div>
              </div>
            </div>
          </section>

          <section class="panel auris-frame">
            <div class="panel-header">
              <div class="panel-title">协作文本</div>
              <div class="panel-code" id="boardPanelCode">B-00</div>
            </div>
            <div class="panel-body">
              <div class="board-toolbar">
                <div class="board-meta" id="boardMeta">
                  <span class="status-label is-sync" id="boardSyncStatus">连接 <strong>初始化</strong></span>
                  <span class="status-label" id="boardVersion">版本 <strong>0</strong></span>
                </div>
                <div class="board-actions">
                  <button class="command-button auris-frame" id="copyBoardButton" type="button">复制</button>
                  <button class="command-button danger auris-frame" id="clearBoardButton" type="button">清空</button>
                </div>
              </div>
              <div class="board-editor-wrap">
                <textarea
                  class="board-editor"
                  id="boardEditor"
                  spellcheck="false"
                  placeholder="团队可在这里实时同步编辑文本，输入内容会自动广播到所有在线成员。"
                  aria-label="协作文本文板"
                ></textarea>
                <div class="board-footer">
                  <div class="board-stats">
                    <span id="boardCharCount">0 字</span>
                    <span id="boardLineCount">1 行</span>
                    <span id="boardUpdatedAt">等待同步</span>
                  </div>
                  <span>自动同步已开启</span>
                </div>
              </div>
            </div>
          </section>

          <section class="panel auris-frame">
            <div class="panel-header">
              <div class="panel-title">共享文件</div>
              <div class="panel-code" id="filePanelCode">F-00</div>
            </div>
            <div class="file-list" id="fileList" aria-live="polite">
              <div class="empty-state">正在读取共享目录<span class="cursor" aria-hidden="true"></span></div>
            </div>
          </section>

          <section class="panel auris-frame">
            <div class="panel-header">
              <div class="panel-title">活动日志</div>
              <div class="panel-code">最近</div>
            </div>
            <div class="panel-body">
              <div class="log-list" id="logList" aria-label="活动日志" aria-live="polite"></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script>
      const state = {
        files: [],
        busy: false,
        sessionId: getSessionId(),
        lastInfo: null,
        board: {
          ackText: "",
          version: 0,
          updatedAt: "",
          sending: false,
          connected: false,
          renderLock: false,
          stream: null,
          flushTimer: 0,
          lastErrorAt: 0,
          pendingOperationIds: new Set(),
        },
      };

      const elements = {
        addressStrip: document.querySelector("#addressStrip"),
        fileInput: document.querySelector("#fileInput"),
        dropzone: document.querySelector("#dropzone"),
        selectButton: document.querySelector("#selectButton"),
        refreshButton: document.querySelector("#refreshButton"),
        fileCount: document.querySelector("#fileCount"),
        totalSize: document.querySelector("#totalSize"),
        onlineUsers: document.querySelector("#onlineUsers"),
        qrImage: document.querySelector("#qrImage"),
        qrLink: document.querySelector("#qrLink"),
        fileList: document.querySelector("#fileList"),
        filePanelCode: document.querySelector("#filePanelCode"),
        operationCode: document.querySelector("#operationCode"),
        operationName: document.querySelector("#operationName"),
        operationPercent: document.querySelector("#operationPercent"),
        operationBytes: document.querySelector("#operationBytes"),
        operationRate: document.querySelector("#operationRate"),
        progressTrack: document.querySelector("#progressTrack"),
        progressFill: document.querySelector("#progressFill"),
        logList: document.querySelector("#logList"),
        darkMode: document.querySelector("#darkMode"),
        lightMode: document.querySelector("#lightMode"),
        boardEditor: document.querySelector("#boardEditor"),
        boardSyncStatus: document.querySelector("#boardSyncStatus"),
        boardVersion: document.querySelector("#boardVersion"),
        boardUpdatedAt: document.querySelector("#boardUpdatedAt"),
        boardCharCount: document.querySelector("#boardCharCount"),
        boardLineCount: document.querySelector("#boardLineCount"),
        boardPanelCode: document.querySelector("#boardPanelCode"),
        copyBoardButton: document.querySelector("#copyBoardButton"),
        clearBoardButton: document.querySelector("#clearBoardButton"),
      };

      init();

      function init() {
        bindEvents();
        addLog("sys", "节点启动，等待局域网访问");
        loadInfo();
        loadFiles();
        loadBoard();
        startHeartbeat();
        startBoardStream();
      }

      function bindEvents() {
        elements.selectButton.addEventListener("click", () => elements.fileInput.click());
        elements.refreshButton.addEventListener("click", loadFiles);
        elements.fileInput.addEventListener("change", () => {
          uploadFiles(Array.from(elements.fileInput.files || []));
          elements.fileInput.value = "";
        });

        ["dragenter", "dragover"].forEach((type) => {
          elements.dropzone.addEventListener(type, (event) => {
            event.preventDefault();
            elements.dropzone.classList.add("is-dragging");
          });
        });

        ["dragleave", "drop"].forEach((type) => {
          elements.dropzone.addEventListener(type, (event) => {
            event.preventDefault();
            elements.dropzone.classList.remove("is-dragging");
          });
        });

        elements.dropzone.addEventListener("drop", (event) => {
          const files = Array.from(event.dataTransfer.files || []);
          uploadFiles(files);
        });

        elements.dropzone.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") {
            return;
          }
          event.preventDefault();
          elements.fileInput.click();
        });

        elements.darkMode.addEventListener("click", () => setTheme("dark"));
        elements.lightMode.addEventListener("click", () => setTheme("light"));
        elements.boardEditor.addEventListener("input", handleBoardInput);
        elements.copyBoardButton.addEventListener("click", copyBoardText);
        elements.clearBoardButton.addEventListener("click", clearBoardText);
        window.addEventListener("beforeunload", () => {
          if (state.board.stream) {
            state.board.stream.close();
          }
        });
      }

      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        elements.darkMode.setAttribute("aria-pressed", String(theme === "dark"));
        elements.lightMode.setAttribute("aria-pressed", String(theme === "light"));
      }

      async function loadInfo() {
        try {
          const info = await fetchJSON("/api/info");
          renderAddresses(info);
        } catch (error) {
          elements.addressStrip.innerHTML = "";
          elements.addressStrip.append(statusLabel("故障", error.message || "读取失败", "error"));
          addLog("error", "无法读取局域网地址");
        }
      }

      async function loadFiles() {
        try {
          state.files = await fetchJSON("/api/files");
          renderFiles();
          addLog("ok", `共享列表同步完成：${state.files.length} 个文件`);
        } catch (error) {
          renderError(error.message || "文件列表读取失败");
          addLog("error", error.message || "文件列表读取失败");
        }
      }

      async function loadBoard(preserveLocal = false) {
        try {
          const snapshot = await fetchJSON("/api/board");
          const currentLocalText = elements.boardEditor.value;
          state.board.ackText = snapshot.text || "";
          state.board.version = Number(snapshot.version) || 0;
          state.board.updatedAt = snapshot.updatedAt || "";
          renderBoardEditor(preserveLocal ? currentLocalText : state.board.ackText);
          if (preserveLocal && currentLocalText !== state.board.ackText) {
            queueBoardFlush(80);
          }
        } catch (error) {
          setBoardSyncStatus("连接", "读取失败", "warn");
          addLog("error", error.message || "白板初始化失败");
        }
      }

      function startBoardStream() {
        if (state.board.stream) {
          state.board.stream.close();
        }
        setBoardSyncStatus("连接", "建立中", "sync");
        const stream = new EventSource("/api/board/stream");
        state.board.stream = stream;

        stream.onopen = () => {
          state.board.connected = true;
          updateBoardStatus();
          addLog("ok", "协作文本文板实时通道已连接");
        };

        stream.onmessage = (event) => {
          try {
            const payload = JSON.parse(event.data);
            handleBoardStreamEvent(payload);
          } catch (error) {
            addLog("warn", "白板推送数据解析失败");
          }
        };

        stream.onerror = () => {
          state.board.connected = false;
          updateBoardStatus();
          const now = Date.now();
          if (now - state.board.lastErrorAt > 8000) {
            state.board.lastErrorAt = now;
            addLog("warn", "白板实时通道重连中");
          }
        };
      }

      function handleBoardStreamEvent(payload) {
        if (!payload || !payload.type) {
          return;
        }

        if (payload.type === "snapshot" && payload.state) {
          const incomingVersion = Number(payload.state.version) || 0;
          if (incomingVersion < state.board.version) {
            return;
          }
          const localText = elements.boardEditor.value;
          const hadLocalChanges = localText !== state.board.ackText;
          state.board.ackText = payload.state.text || "";
          state.board.version = incomingVersion;
          state.board.updatedAt = payload.state.updatedAt || "";
          renderBoardEditor(hadLocalChanges ? localText : state.board.ackText);
          if (hadLocalChanges) {
            queueBoardFlush(50);
          }
          return;
        }

        if (payload.type !== "operation" || !payload.operation) {
          return;
        }

        const operation = normalizeOperation(payload.operation);
        if (operation.version <= state.board.version) {
          return;
        }

        const previousAckText = state.board.ackText;
        const localText = elements.boardEditor.value;
        const localSelection = {
          start: elements.boardEditor.selectionStart || 0,
          end: elements.boardEditor.selectionEnd || 0,
        };

        const isPendingLocalEcho =
          operation.sessionId === state.sessionId &&
          state.board.pendingOperationIds.has(operation.operationId);

        state.board.ackText = applyOperation(previousAckText, operation);
        state.board.version = operation.version;
        state.board.updatedAt = operation.updatedAt || "";

        if (isPendingLocalEcho) {
          state.board.pendingOperationIds.delete(operation.operationId);
          const hasAdditionalLocalChanges = localText !== state.board.ackText;
          renderBoardEditor(hasAdditionalLocalChanges ? localText : state.board.ackText, localSelection);
          if (hasAdditionalLocalChanges) {
            queueBoardFlush(60);
          }
          return;
        }

        let nextText = state.board.ackText;
        let selectionOperation = operation;
        const localDiff = computeTextOperation(previousAckText, localText);
        if (localDiff) {
          const transformedRemote = transformOperation(operation, localDiff, false);
          nextText = applyOperation(localText, transformedRemote);
          selectionOperation = transformedRemote;
          queueBoardFlush(60);
        }

        renderBoardEditor(nextText, localSelection, selectionOperation);
        if (operation.sessionId !== state.sessionId) {
          addLog("ok", "协作文本文板收到新的团队编辑");
        }
      }

      function handleBoardInput() {
        if (state.board.renderLock) {
          return;
        }
        updateBoardMetrics(elements.boardEditor.value);
        updateBoardStatus();
        queueBoardFlush(140);
      }

      function queueBoardFlush(delay = 140) {
        window.clearTimeout(state.board.flushTimer);
        state.board.flushTimer = window.setTimeout(() => {
          flushBoardChanges();
        }, delay);
      }

      async function flushBoardChanges() {
        window.clearTimeout(state.board.flushTimer);
        state.board.flushTimer = 0;
        if (state.board.sending) {
          return;
        }

        const localText = elements.boardEditor.value;
        const operation = computeTextOperation(state.board.ackText, localText);
        if (!operation) {
          updateBoardStatus();
          return;
        }

        const operationId = createOperationId();
        state.board.sending = true;
        state.board.pendingOperationIds.add(operationId);
        updateBoardStatus();

        try {
          const response = await fetchJSON("/api/board/ops", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              sessionId: state.sessionId,
              operationId,
              baseVersion: state.board.version,
              start: operation.start,
              end: operation.end,
              text: operation.text,
            }),
          });

          state.board.ackText = response.text || "";
          state.board.version = Number(response.version) || state.board.version;
          state.board.updatedAt = response.updatedAt || "";
          state.board.pendingOperationIds.delete(operationId);
          updateBoardMetrics(elements.boardEditor.value);
          updateBoardStatus();
          if (elements.boardEditor.value !== state.board.ackText) {
            queueBoardFlush(40);
          }
        } catch (error) {
          state.board.pendingOperationIds.delete(operationId);
          if ((error.message || "").includes("版本过旧")) {
            addLog("warn", "白板版本已变化，正在重新同步");
            await loadBoard(true);
          } else {
            addLog("error", `白板同步失败：${error.message || "未知错误"}`);
          }
        } finally {
          state.board.sending = false;
          updateBoardStatus();
        }
      }

      async function copyBoardText() {
        const text = elements.boardEditor.value;
        if (!text) {
          addLog("warn", "白板为空，无可复制内容");
          return;
        }
        try {
          await navigator.clipboard.writeText(text);
          addLog("ok", "白板文本已复制到剪贴板");
        } catch (error) {
          elements.boardEditor.focus();
          elements.boardEditor.select();
          addLog("warn", "当前环境不支持直接写入剪贴板，已选中文本");
        }
      }

      function clearBoardText() {
        if (!elements.boardEditor.value) {
          return;
        }
        const confirmed = window.confirm("清空协作文本文板？");
        if (!confirmed) {
          return;
        }
        elements.boardEditor.value = "";
        updateBoardMetrics("");
        updateBoardStatus();
        queueBoardFlush(30);
        addLog("warn", "协作文本文板已请求清空");
      }

      function renderBoardEditor(text, selection, operation) {
        const shouldPreserveSelection =
          document.activeElement === elements.boardEditor &&
          selection &&
          typeof selection.start === "number" &&
          typeof selection.end === "number";

        state.board.renderLock = true;
        elements.boardEditor.value = text;
        state.board.renderLock = false;

        if (shouldPreserveSelection) {
          const nextStart = Math.min(transformIndex(selection.start, operation, true), text.length);
          const nextEnd = Math.min(transformIndex(selection.end, operation, true), text.length);
          elements.boardEditor.focus({ preventScroll: true });
          elements.boardEditor.setSelectionRange(nextStart, nextEnd);
        }

        updateBoardMetrics(text);
        updateBoardStatus();
      }

      function updateBoardMetrics(text) {
        elements.boardCharCount.textContent = `${text.length} 字`;
        elements.boardLineCount.textContent = `${Math.max(1, text.split("\n").length)} 行`;
        elements.boardPanelCode.textContent = `B-${String(state.board.version).padStart(2, "0")}`;
      }

      function updateBoardStatus() {
        const localText = elements.boardEditor.value;
        const dirty = localText !== state.board.ackText;

        if (!state.board.connected) {
          setBoardSyncStatus("连接", "重连中", "sync");
        } else if (state.board.sending) {
          setBoardSyncStatus("同步", "发送中", "sync");
        } else if (dirty) {
          setBoardSyncStatus("同步", "等待提交", "sync");
        } else {
          setBoardSyncStatus("同步", "已同步", "online");
        }

        elements.boardVersion.innerHTML = `版本 <strong>${escapeHTML(String(state.board.version))}</strong>`;
        elements.boardUpdatedAt.textContent = state.board.updatedAt
          ? `最近同步 ${formatDateTime(state.board.updatedAt)}`
          : "等待同步";
      }

      function setBoardSyncStatus(label, value, level) {
        elements.boardSyncStatus.className = "status-label";
        if (level === "online") {
          elements.boardSyncStatus.classList.add("is-online");
        }
        if (level === "sync") {
          elements.boardSyncStatus.classList.add("is-sync");
        }
        if (level === "warn") {
          elements.boardSyncStatus.classList.add("is-warn");
        }
        if (level === "error") {
          elements.boardSyncStatus.classList.add("is-error");
        }
        elements.boardSyncStatus.innerHTML = `${escapeHTML(label)} <strong>${escapeHTML(value)}</strong>`;
      }

      async function fetchJSON(url, options) {
        const response = await fetch(url, options);
        if (!response.ok) {
          const error = await response.json().catch(() => ({}));
          throw new Error(error.error || `HTTP ${response.status}`);
        }
        return response.json();
      }

      function renderAddresses(info) {
        state.lastInfo = info;
        const port = info.port || location.port || "8080";
        const ips = Array.isArray(info.ips) ? info.ips : [];
        const shareURL = buildShareURL(ips[0], port);
        renderOnlineUsers(info.users || 0);
        renderQRCode(shareURL);
        elements.addressStrip.innerHTML = "";
        elements.addressStrip.append(statusLabel("本机", `${location.hostname || "localhost"}:${port}`, "online"));
        elements.addressStrip.append(statusLabel("在线", `${info.users || 0} 人`, "online"));
        if (ips.length === 0) {
          elements.addressStrip.append(statusLabel("局域网", "未检测到局域网 IPv4", "sync"));
          return;
        }
        ips.forEach((ip) => {
          elements.addressStrip.append(statusLabel("局域网地址", `${ip}:${port}`, "sync"));
        });
      }

      function statusLabel(label, value, level) {
        const node = document.createElement("span");
        const classes = ["status-label"];
        if (level === "online") {
          classes.push("is-online");
        }
        if (level === "sync") {
          classes.push("is-sync");
        }
        if (level === "warn") {
          classes.push("is-warn");
        }
        if (level === "error") {
          classes.push("is-error");
        }
        node.className = classes.join(" ");
        node.innerHTML = `${escapeHTML(label)} <strong>${escapeHTML(value)}</strong>`;
        return node;
      }

      function buildShareURL(ip, port) {
        const host = ip || location.hostname || "localhost";
        const safePort = port || location.port || "8080";
        return `${location.protocol}//${host}:${safePort}/`;
      }

      function renderQRCode(shareURL) {
        elements.qrLink.href = shareURL;
        elements.qrLink.textContent = shareURL;
        elements.qrImage.src = `/api/qr?url=${encodeURIComponent(shareURL)}`;
      }

      function renderOnlineUsers(users) {
        elements.onlineUsers.textContent = String(users);
      }

      function getSessionId() {
        const key = "lzc_wifi_session_id";
        const existing = sessionStorage.getItem(key);
        if (existing) {
          return existing;
        }
        const generated =
          crypto.randomUUID?.() ||
          `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
        sessionStorage.setItem(key, generated);
        return generated;
      }

      function startHeartbeat() {
        sendHeartbeat();
        window.setInterval(sendHeartbeat, 15000);
      }

      async function sendHeartbeat() {
        try {
          const response = await fetchJSON("/api/heartbeat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              sessionId: state.sessionId,
            }),
          });
          const users = response.users || 0;
          renderOnlineUsers(users);
          if (state.lastInfo) {
            renderAddresses({ ...state.lastInfo, users });
          }
        } catch (error) {
          addLog("warn", "在线人数同步失败");
        }
      }

      async function uploadFiles(files) {
        if (files.length === 0 || state.busy) {
          return;
        }
        state.busy = true;
        setCommandState(true);
        try {
          for (const file of files) {
            await uploadFile(file);
          }
          await loadFiles();
        } finally {
          state.busy = false;
          setCommandState(false);
        }
      }

      function uploadFile(file) {
        return new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          const form = new FormData();
          const startedAt = performance.now();
          form.append("file", file);

          resetProgress("上传", file.name, file.size);
          xhr.open("POST", "/api/upload");

          xhr.upload.onprogress = (event) => {
            updateProgress("上传", file.name, event.loaded, event.total || file.size, startedAt);
          };

          xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
              updateProgress("上传", file.name, file.size, file.size, startedAt);
              addLog("ok", `上传完成：${file.name}`);
              resolve();
              return;
            }
            const message = parseXHRError(xhr);
            addLog("error", `上传失败：${file.name} / ${message}`);
            reject(new Error(message));
          };

          xhr.onerror = () => {
            addLog("error", `上传中断：${file.name}`);
            reject(new Error("网络错误"));
          };

          xhr.send(form);
        });
      }

      function downloadFile(file) {
        if (state.busy) {
          return;
        }

        state.busy = true;
        setCommandState(true);
        const xhr = new XMLHttpRequest();
        const startedAt = performance.now();
        resetProgress("下载", file.name, file.size);

        xhr.open("GET", file.download);
        xhr.responseType = "blob";

        xhr.onprogress = (event) => {
          updateProgress("下载", file.name, event.loaded, event.lengthComputable ? event.total : file.size, startedAt);
        };

        xhr.onload = () => {
          state.busy = false;
          setCommandState(false);
          if (xhr.status >= 200 && xhr.status < 300) {
            updateProgress("下载", file.name, file.size, file.size, startedAt);
            saveBlob(xhr.response, file.name);
            addLog("ok", `下载完成：${file.name}`);
            loadFiles();
            return;
          }
          const message = parseXHRError(xhr);
          addLog("error", `下载失败：${file.name} / ${message}`);
        };

        xhr.onerror = () => {
          state.busy = false;
          setCommandState(false);
          addLog("error", `下载中断：${file.name}`);
        };

        xhr.send();
      }

      async function deleteFile(file) {
        if (state.busy) {
          return;
        }
        const confirmed = window.confirm(`删除 ${file.name}？`);
        if (!confirmed) {
          return;
        }

        state.busy = true;
        setCommandState(true);
        resetProgress("删除", file.name, file.size);
        try {
          const response = await fetch(`/api/files/${encodeURIComponent(file.name)}`, { method: "DELETE" });
          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.error || `HTTP ${response.status}`);
          }
          updateProgress("删除", file.name, file.size, file.size, performance.now() - 1);
          addLog("warn", `已删除：${file.name}`);
          await loadFiles();
        } catch (error) {
          addLog("error", `删除失败：${file.name} / ${error.message}`);
        } finally {
          state.busy = false;
          setCommandState(false);
        }
      }

      function renderFiles() {
        const total = state.files.reduce((sum, file) => sum + file.size, 0);
        elements.fileCount.textContent = String(state.files.length);
        elements.totalSize.textContent = formatBytes(total);
        elements.filePanelCode.textContent = `F-${String(state.files.length).padStart(2, "0")}`;

        if (state.files.length === 0) {
          elements.fileList.innerHTML = '<div class="empty-state">共享目录为空<span class="cursor" aria-hidden="true"></span></div>';
          return;
        }

        elements.fileList.innerHTML = `
          <div class="file-head" aria-hidden="true">
            <span>文件名</span>
            <span>大小</span>
            <span>下载次数</span>
            <span>修改时间</span>
            <span>操作</span>
          </div>
        `;

        for (const file of state.files) {
          const row = document.createElement("div");
          row.className = "file-row";
          row.innerHTML = `
            <div class="file-name">
              <strong>${escapeHTML(file.name)}</strong>
              <span class="file-ext">${escapeHTML(file.extension || "文件")}</span>
            </div>
            <div class="file-size">${formatBytes(file.size)}</div>
            <div class="file-downloads">${formatCount(file.downloads)}</div>
            <div class="file-time">${formatDate(file.modTime)}</div>
            <div class="file-actions">
              <button class="file-action auris-frame" type="button">下载</button>
              <button class="file-action danger auris-frame" type="button">删除</button>
            </div>
          `;
          const [downloadButton, deleteButton] = row.querySelectorAll("button");
          downloadButton.addEventListener("click", () => downloadFile(file));
          deleteButton.addEventListener("click", () => deleteFile(file));
          elements.fileList.append(row);
        }
      }

      function renderError(message) {
        elements.fileList.innerHTML = `<div class="empty-state">${escapeHTML(message)}</div>`;
      }

      function resetProgress(code, name, total) {
        elements.operationCode.textContent = code;
        elements.operationName.textContent = name;
        elements.operationPercent.textContent = "0%";
        elements.operationBytes.textContent = `0 B / ${formatBytes(total || 0)}`;
        elements.operationRate.textContent = "0 B/s";
        elements.progressTrack.setAttribute("aria-valuenow", "0");
        elements.progressTrack.setAttribute("aria-valuetext", `${code} ${name} 0%`);
        elements.progressFill.style.width = "0%";
      }

      function updateProgress(code, name, loaded, total, startedAt) {
        const safeTotal = Math.max(total || loaded || 0, 0);
        const percent = safeTotal > 0 ? Math.min(100, Math.round((loaded / safeTotal) * 100)) : 0;
        const elapsed = Math.max((performance.now() - startedAt) / 1000, 0.001);
        elements.operationCode.textContent = code;
        elements.operationName.textContent = name;
        elements.operationPercent.textContent = `${percent}%`;
        elements.operationBytes.textContent = `${formatBytes(loaded)} / ${formatBytes(safeTotal)}`;
        elements.operationRate.textContent = `${formatBytes(loaded / elapsed)}/s`;
        elements.progressTrack.setAttribute("aria-valuenow", String(percent));
        elements.progressTrack.setAttribute("aria-valuetext", `${code} ${name} ${percent}%`);
        elements.progressFill.style.width = `${percent}%`;
      }

      function setCommandState(isBusy) {
        elements.selectButton.disabled = isBusy;
        elements.refreshButton.disabled = isBusy;
        elements.fileList.querySelectorAll("button").forEach((button) => {
          button.disabled = isBusy;
        });
      }

      function saveBlob(blob, name) {
        const objectURL = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = objectURL;
        link.download = name;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(objectURL), 1000);
      }

      function parseXHRError(xhr) {
        try {
          const parsed = JSON.parse(xhr.responseText);
          return parsed.error || `HTTP ${xhr.status}`;
        } catch (error) {
          return `HTTP ${xhr.status}`;
        }
      }

      function normalizeOperation(operation) {
        return {
          sessionId: operation.sessionId || "",
          operationId: operation.operationId || "",
          start: Number(operation.start) || 0,
          end: Number(operation.end) || 0,
          text: operation.text || "",
          version: Number(operation.version) || 0,
          updatedAt: operation.updatedAt || "",
        };
      }

      function computeTextOperation(source, target) {
        if (source === target) {
          return null;
        }

        let start = 0;
        while (start < source.length && start < target.length && source[start] === target[start]) {
          start += 1;
        }

        let sourceEnd = source.length;
        let targetEnd = target.length;
        while (sourceEnd > start && targetEnd > start && source[sourceEnd - 1] === target[targetEnd - 1]) {
          sourceEnd -= 1;
          targetEnd -= 1;
        }

        return {
          start,
          end: sourceEnd,
          text: target.slice(start, targetEnd),
        };
      }

      function applyOperation(text, operation) {
        return text.slice(0, operation.start) + (operation.text || "") + text.slice(operation.end);
      }

      function transformOperation(operation, applied, preferAfter) {
        return {
          ...operation,
          start: transformIndex(operation.start, applied, preferAfter),
          end: Math.max(
            transformIndex(operation.start, applied, preferAfter),
            transformIndex(operation.end, applied, preferAfter)
          ),
        };
      }

      function transformIndex(index, operation, preferAfter) {
        if (!operation) {
          return index;
        }
        const insertedLength = (operation.text || "").length;
        const replacedLength = Math.max(0, operation.end - operation.start);
        const delta = insertedLength - replacedLength;

        if (index < operation.start) {
          return index;
        }
        if (index > operation.end) {
          return index + delta;
        }
        if (index === operation.start) {
          return preferAfter ? operation.start + insertedLength : operation.start;
        }
        if (index === operation.end) {
          return operation.start + insertedLength;
        }
        return preferAfter ? operation.start + insertedLength : operation.start;
      }

      function createOperationId() {
        return (
          crypto.randomUUID?.() ||
          `op-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`
        );
      }

      function addLog(level, message) {
        const line = document.createElement("div");
        line.className = "log-line";
        line.dataset.level = level;
        line.innerHTML = `<span class="log-time">${currentTime()}</span><span>${escapeHTML(message)}</span>`;
        elements.logList.prepend(line);
        while (elements.logList.children.length > 80) {
          elements.logList.lastElementChild.remove();
        }
      }

      function currentTime() {
        return new Intl.DateTimeFormat("zh-CN", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(new Date());
      }

      function formatDate(value) {
        return new Intl.DateTimeFormat("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
        }).format(new Date(value));
      }

      function formatDateTime(value) {
        return new Intl.DateTimeFormat("zh-CN", {
          month: "2-digit",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(new Date(value));
      }

      function formatBytes(bytes) {
        const units = ["B", "KB", "MB", "GB", "TB"];
        let value = Number(bytes) || 0;
        let index = 0;
        while (value >= 1024 && index < units.length - 1) {
          value /= 1024;
          index += 1;
        }
        return `${value >= 10 || index === 0 ? value.toFixed(0) : value.toFixed(1)} ${units[index]}`;
      }

      function formatCount(value) {
        return `${Number(value) || 0} 次`;
      }

      function escapeHTML(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }
    </script>
  </body>
</html>
